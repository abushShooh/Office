<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="#" aria-label="На главную">
                <img src="../photos/Лого.svg" alt="Логотип компании">
            </a>

            <div class="containerInfo">
                <ul>
                    <li>О компании</li>
                    <li>Новости</li>
                    <li>Помощь</li>
                    <li>Отзывы</li>
                    <li>Контакты</li>
                </ul>

                <div class="support">
                    <ul>
                        <li>Служба продаж</li>
                        <li>+7 495 123-45-67</li>
                    </ul>
                </div>
            </div>

            <button class="menu-toggle" type="button" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero__overlay"></div>
            <div class="hero__content">
                <h1>Капитальный ремонт офисов</h1>
                <p>Реконструкция, отделка, капитальный ремонт офисных помещений в Москве и области. Гарантия до 5-ти лет</p>

                <div class="hero__actions">
                    <a class="btn btn--primary" href="#">Оставить заявку</a>
                    <a class="btn btn--secondary" href="#">Узнать подробности</a>
                </div>

                <span class="hero__note">Авторский надзор в подарок</span>
            </div>

            <button class="hero__scroll" type="button" aria-label="Прокрутить вниз">
                <span></span>
            </button>
        </section>
    </main>
</body>
</html>
